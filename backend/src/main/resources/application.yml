server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: aguiabranca-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aguiabranca}
      database: ${MONGODB_DATABASE:aguiabranca}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: always
  mvc:
    throw-exception-if-no-handler-found: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: aguiabranca
    access-token-ttl: ${JWT_ACCESS_TTL:PT1H}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    timeout: PT12S
    base-url: https://generativelanguage.googleapis.com
  advice:
    base-url: ${ADVICE_BASE_URL:https://api.adviceslip.com}
    timeout: PT5S
    cache-ttl: PT60M
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  seed:
    enabled: ${SEED_ENABLED:false}
  openapi:
    public: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId}] %logger{36} - %msg%n"
