app:
  jwt:
    secret: test-jwt-secret-must-be-32-bytes-min
    issuer: aguiabranca
    access-token-ttl: PT1H
    refresh-token-ttl: P7D
  seed:
    enabled: true
  cors:
    allowed-origins: http://localhost:8080
  openapi:
    public: true

logging:
  level:
    br.com.fiap.aguiabranca: INFO
    org.springframework.security: WARN
