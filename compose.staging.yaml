name: aguiabranca-staging

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
    volumes:
      - staging-mongo-data:/data/db
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:?Set API_IMAGE to the published immutable image reference}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGODB_DATABASE:-aguiabranca_staging}?authSource=admin
      MONGODB_DATABASE: ${MONGODB_DATABASE:-aguiabranca_staging}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT1H}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      SEED_ENABLED: ${SEED_ENABLED:-false}
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    networks:
      - staging-network
    depends_on:
      mongo:
        condition: service_healthy

networks:
  staging-network:
    name: aguiabranca-staging-network
    driver: bridge

volumes:
  staging-mongo-data:
    name: aguiabranca-staging-mongo-data