name: CI and container delivery

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend
        run: mvn -B -f backend/pom.xml clean verify

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build Android app
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aguiabranca-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-image:
    name: Build and publish API image
    if: github.event_name == 'push'
    needs: [backend, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image-ref.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Create immutable image reference
        id: image-ref
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          first_tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          image_name="${first_tag%:*}"
          printf 'image_ref=%s@%s\n' "$image_name" "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: publish-image
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      image_ref: ${{ needs.publish-image.outputs.image_ref }}
    secrets: inherit

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-image
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      image_ref: ${{ needs.publish-image.outputs.image_ref }}
    secrets: inherit